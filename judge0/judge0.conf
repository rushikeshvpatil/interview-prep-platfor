################################################################################
# Judge0 Configuration File
################################################################################

# Maintenance Mode
MAINTENANCE_MODE=false

# Authentication
# When set, requests must include the X-Auth-Token header matching this token
AUTH_TOKEN=secret_interview_token

# Submission Settings
# CPU Time Limit (seconds)
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0

# Memory Limit (KB)
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000

# Stack Limit (KB)
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

# Max Processes and Output Size
MAX_PROCESSES_AND_OR_THREADS=60
MAX_OUTPUT_SIZE=128000

# Network Access for Sandboxed Programs (false prevents untrusted code from outbound network access)
ENABLE_NETWORK=false

# Worker Settings
NUMBER_OF_RUNS=1
CONCURRENT_SUBMISSIONS=4
SUBMISSION_CACHE_DURATION=3600
